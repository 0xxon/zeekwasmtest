<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeek Script Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1e1e1e; color: #d4d4d4; font-family: sans-serif; }
    #header { padding: 8px 16px; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; gap: 12px; }
    #header h1 { font-size: 14px; font-weight: 600; }
    #status { font-size: 12px; color: #858585; }
    #editor-container { height: calc(100vh - 37px); }
  </style>
</head>
<body>
  <div id="header">
    <h1>Zeek Script Editor</h1>
    <span id="status">Loading LSP...</span>
  </div>
  <div id="editor-container"></div>

  <!-- COOP/COEP service worker (enables SharedArrayBuffer without special server headers) -->
  <script src="./coi-serviceworker.js"></script>

  <!-- Monaco Editor via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>

  <!-- Zeek editor setup -->
  <script type="module" src="./zeek-editor.js"></script>
</body>
</html>
